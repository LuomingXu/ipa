<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPA 下载</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📦</text></svg>">
<style>
  :root {
    --bg: #ffffff;
    --surface: #f6f7f9;
    --border: #e3e6ea;
    --text: #1a1d21;
    --muted: #6b7280;
    --accent: #2f6feb;
    --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --surface: #171a20;
      --border: #272b33;
      --text: #e6e8eb;
      --muted: #9aa2ad;
      --accent: #4c8dff;
      --accent-text: #0f1115;
    }
  }
  * { box-sizing: border-box; }
  html { scrollbar-color: var(--border) var(--bg); scrollbar-width: thin; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  body {
    margin: 0;
    padding: 32px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; }
  h1 { margin: 0 0 6px; font-size: 24px; }
  .lede { margin: 0 0 4px; color: var(--muted); font-size: 14px; }
  .meta-line { margin: 0 0 24px; color: var(--muted); font-size: 13px; }
  a { color: var(--accent); }

  ul { list-style: none; margin: 0; padding: 0; }
  li.app {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    padding: 14px 16px;
    margin-bottom: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  li.app:hover { border-color: var(--accent); }
  .info { flex: 1 1 260px; min-width: 0; }
  .name { font-weight: 600; }
  .name a { color: inherit; text-decoration: none; }
  .name a:hover { color: var(--accent); text-decoration: underline; }
  .tag {
    display: inline-block;
    margin-left: 8px;
    padding: 1px 7px;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 20px;
    vertical-align: middle;
  }
  .file {
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 12.5px;
    color: var(--muted);
    word-break: break-all;
    margin-top: 2px;
  }
  .meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .btn {
    flex: 0 0 auto;
    display: inline-block;
    padding: 8px 20px;
    background: var(--accent);
    color: var(--accent-text);
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { filter: brightness(0.94); }

  .state {
    padding: 20px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted);
    font-size: 14px;
  }
  .state button {
    margin-left: 10px;
    padding: 4px 12px;
    font: inherit;
    color: var(--accent);
    background: transparent;
    border: 1px solid var(--accent);
    border-radius: 6px;
    cursor: pointer;
  }
  footer {
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 12.5px;
  }
</style>
</head>
<body>
<main>
  <h1>IPA 下载</h1>
  <p class="lede">每天自动同步上游官方 release 的 iOS 安装包，点击即可下载。</p>
  <p class="meta-line">
    <span id="updated"></span>
    <a id="release-link" href="https://github.com/LuomingXu/ipa/releases/tag/latest">GitHub Release</a>
  </p>

  <div id="content"><div class="state">加载中…</div></div>

  <footer>
    IPA 需自行签名后安装（SideStore / AltStore / 爱思助手等）。文件未经修改，直接镜像自上游官方
    release，版权归各上游项目所有。
  </footer>
</main>

<script>
const SOURCES = [
  './manifest.json',
  'https://raw.githubusercontent.com/LuomingXu/ipa/master/manifest.json'
];
const RELEASE_URL = 'https://github.com/LuomingXu/ipa/releases/tag/latest';
const content = document.getElementById('content');

function safeUrl(value) {
  return typeof value === 'string' && value.startsWith('https://') ? value : null;
}

function formatSize(bytes) {
  return (bytes / 1048576).toFixed(1) + ' MiB';
}

async function loadManifest() {
  for (const src of SOURCES) {
    try {
      const res = await fetch(src, { cache: 'no-cache' });
      if (!res.ok) continue;
      const data = await res.json();
      if (data && Array.isArray(data.apps) && data.apps.length) return data;
    } catch (err) {
      // file:// 下同源 fetch 会直接抛异常，继续试下一个源
    }
  }
  throw new Error('无法加载清单');
}

function render(data) {
  const updated = document.getElementById('updated');
  if (data.release_updated) {
    const d = new Date(data.release_updated);
    updated.textContent = '镜像更新于 ' + d.toLocaleString('zh-CN', { hour12: false }) + ' · ';
  }
  const releaseLink = document.getElementById('release-link');
  const releaseUrl = safeUrl(data.release);
  if (releaseUrl) releaseLink.href = releaseUrl;

  const list = document.createElement('ul');
  for (const app of data.apps) {
    const item = document.createElement('li');
    item.className = 'app';

    const info = document.createElement('div');
    info.className = 'info';

    const name = document.createElement('div');
    name.className = 'name';
    const label = (app.repo && app.repo.split('/')[1]) || app.name;
    const repoUrl = app.repo ? safeUrl('https://github.com/' + app.repo) : null;
    if (repoUrl) {
      const a = document.createElement('a');
      a.href = repoUrl;
      a.textContent = label;
      a.target = '_blank';
      a.rel = 'noopener';
      name.appendChild(a);
    } else {
      name.textContent = label;
    }
    if (app.tag) {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = app.tag;
      name.appendChild(tag);
    }
    info.appendChild(name);

    const file = document.createElement('div');
    file.className = 'file';
    file.textContent = app.name;
    info.appendChild(file);

    const meta = document.createElement('div');
    meta.className = 'meta';
    const parts = [formatSize(app.size)];
    if (app.published) parts.push('上游发布 ' + app.published);
    meta.textContent = parts.join(' · ');
    info.appendChild(meta);

    item.appendChild(info);

    const url = safeUrl(app.url);
    const btn = document.createElement('a');
    btn.className = 'btn';
    btn.textContent = '下载';
    if (url) {
      btn.href = url;
      // 下载直链要走两跳 302 才变成 attachment，在当前标签页里导航时
      // 再点一次会顶掉上一个未完成的导航，浏览器就会提示取消之前的下载
      btn.target = '_blank';
      btn.rel = 'noopener';
    } else {
      btn.removeAttribute('href');
      btn.style.opacity = '.5';
    }
    item.appendChild(btn);

    list.appendChild(item);
  }
  content.replaceChildren(list);
}

function renderError() {
  const box = document.createElement('div');
  box.className = 'state';
  box.appendChild(document.createTextNode('清单加载失败，可以直接去 Release 页面下载。'));

  const link = document.createElement('a');
  link.href = RELEASE_URL;
  link.textContent = '打开 Release';
  link.style.marginLeft = '8px';
  box.appendChild(link);

  const retry = document.createElement('button');
  retry.textContent = '重试';
  retry.addEventListener('click', start);
  box.appendChild(retry);

  content.replaceChildren(box);
}

async function start() {
  const loading = document.createElement('div');
  loading.className = 'state';
  loading.textContent = '加载中…';
  content.replaceChildren(loading);
  try {
    render(await loadManifest());
  } catch (err) {
    renderError();
  }
}

start();
</script>
</body>
</html>
