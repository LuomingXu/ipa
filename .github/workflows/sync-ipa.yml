name: Sync IPA

on:
  schedule:
    - cron: '0 22 * * *' # 每天 06:00 (UTC+8)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-ipa
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Sync upstream IPA to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/sync-ipa.sh